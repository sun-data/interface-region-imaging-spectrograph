[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-region-imaging-spectrograph"
authors = [
    {name = "Roy T. Smart", email = "roytsmart@gmail.com"},
]
description = "A Python library for analyzing solar observations from the Interface Region Imaging Spectrograph (IRIS)."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ipython",
    "astropy",
    "requests",
    "joblib",
    "irispy-lmsal>=0.8.1",
    "named-arrays~=2.9",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
]
doc = [
    "pytest",
    "matplotlib",
    "graphviz",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-bibtex",
    "pydata-sphinx-theme",
    "ipykernel",
    "jupyter-sphinx",
    "sphinx-favicon",
]

[project.urls]
Homepage = "https://github.com/sun-data/interface-region-imaging-spectrograph"
Documentation = "https://interface-region-imaging-spectrograph.readthedocs.io/en/latest"

[tool.setuptools_scm]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
iris = ["py.typed"]

[tool.pyright]
include = ["iris"]
# The tests are excluded because `astropy` does not ship a `py.typed` marker.
# Expressions such as `numpy.linspace(...) * astropy.units.mm`, which the tests
# use heavily, are therefore inferred as a union of unit types rather than as a
# `Quantity`, and silencing that requires more noise than the tests are worth.
exclude = ["**/_tests", "**/*_test.py", "**/__pycache__"]
typeCheckingMode = "standard"
